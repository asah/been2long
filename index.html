/* A single overview opens the story; cards carry the visual playfulness. */
.overview {
  margin-top:28px;
  padding:24px 28px;
  border-radius:12px;
}
.overview-heading h1 {
  font:2.6rem/1.15 var(--serif);
  letter-spacing:-.5px;
}
.overview-heading h1>span:last-child {color:#899b72}
.overview-context {margin-top:6px;font-size:.8125rem}
.overview-bullets {
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px 28px;
  margin-top:20px;
}
.overview-bullets>li:first-child {grid-column:span 2}
.overview-bullets h3 {font-size:.75rem;margin-bottom:4px}
.overview-bullets p {line-height:1.7;font-size:.875rem}
.overview-bullets button {font-size:inherit;line-height:inherit;display:inline}
.overview-bullets button:hover {text-decoration:underline}
.overview-bullets button:focus-visible {outline-offset:2px}
.overview-bullets button+button {margin-left:3px}
.overview-empty {grid-column:1/-1!important}
.story-layout {display:block}
.story-grid {grid-template-columns:repeat(6,minmax(0,1fr));gap:26px;align-items:stretch}
.story-card {grid-column:span 3;border-radius:14px;transition:box-shadow .25s;align-self:stretch}
.story-card:hover {transform:none;box-shadow:0 10px 32px #273c2f14}
.card-photo {flex-shrink:0}
.card-photo img {
  height:250px;
  transform:scale(var(--photo-zoom,1));
  transition:transform .16s linear;
  transform-origin:center;
}
@media(hover:hover) {
  .story-card:hover .card-photo img {transform:scale(calc(var(--photo-zoom,1) + .025))}
}

document.querySelector('.author-identity img').src=authorProfile.photo;
function validateThread(value){
  if(!value||typeof value.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(value.id)||typeof value.name!=='string'||!value.name.trim()||value.name.length>80||!categories[value.category]||typeof value.ongoing!=='boolean')throw Object.assign(Error('Give the thread a name, category, and ongoing setting.'),{status:400});
  return {id:value.id,name:value.name.trim(),category:value.category,ongoing:value.ongoing};
}
function migrateThreadCollection(stories,savedThreads){
  const legacy=!Array.isArray(savedThreads);
  const threads=legacy?demoThreadSpecs.filter(thread=>stories.some(story=>thread.storyIds.includes(story.id))).map(({storyIds,...thread})=>({...thread})):savedThreads.map(validateThread);
  const ids=new Set(threads.map(thread=>thread.id));
  const migrated=stories.map(story=>{
    let threadIds=Array.isArray(story.threadIds)?story.threadIds.filter(id=>ids.has(id)):legacy?demoThreadSpecs.filter(thread=>ids.has(thread.id)&&thread.storyIds.includes(story.id)).map(thread=>thread.id):[];
    if(!threadIds.length){
      const id='updates-'+story.category;
      if(!ids.has(id)){threads.push({id,name:categories[story.category]||'Life updates',category:story.category,ongoing:false});ids.add(id);}
      threadIds=[id];
    }
    return {...story,threadIds:[...new Set(threadIds)]};
  });
  return {stories:migrated,threads};
}
function threadStories(thread,stories){return stories.filter(story=>story.threadIds?.includes(thread.id)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));}
function threadSpan(thread,stories,today){
  const members=threadStories(thread,stories);if(!members.length)return null;
  return {start:members[0].date,lastStory:members.at(-1).date,end:thread.ongoing?today:members.at(-1).date,ongoing:thread.ongoing,count:members.length};
}
function matchesThreadCategory(story,threads,category){return category==='all'||!story.threadIds?.length&&story.category===category||threads.some(thread=>thread.category===category&&story.threadIds?.includes(thread.id));}
function timelineModel(threads,stories,{since,until,today,category='all',topics=null,selectedThreadId=null}={}){
  const topicMatch=story=>topics===null||topics.length>0&&story.tags.some(tag=>topics.includes(tag));
  const available=stories.filter(topicMatch);
  const rows=threads.filter(thread=>category==='all'||thread.category===category).map(thread=>{
    const span=threadSpan(thread,stories,today);if(!span)return null;
    const members=threadStories(thread,available);
    if(!members.length||thread.id!==selectedThreadId&&(span.start>until||span.end<since))return null;
    return {thread,span,members,updates:members.filter(story=>story.date>=since&&story.date<=until)};
  }).filter(Boolean);
  const dates=stories.map(story=>story.date).sort();
  const start=dates[0]||since,end=[today,until,dates.at(-1)||until].sort().at(-1);
  const denominator=Math.max(86400000,Date.parse(end)-Date.parse(start));
  const position=date=>Math.max(0,Math.min(100,(Date.parse(date)-Date.parse(start))/denominator*100));
  return {rows,start,end,windowStart:position(since),windowEnd:position(until),position};
}

function timelineMarkers(members,position,minDistance=4){
  const markers=[];
  for(const story of [...members].sort((a,b)=>a.date.localeCompare(b.date))){
    const value=position(story.date),last=markers.at(-1);
    if(last&&value-last.start<minDistance){last.stories.push(story);last.position=last.start;}
    else markers.push({start:value,position:value,stories:[story]});
  }
  return markers;
}

// Share the reading view, never email addresses or publisher credentials.
function buildCatchupUrl(base,state){
  const url=new URL(base),p=new URLSearchParams();
  if(state.readerToken)p.set('reader',state.readerToken);else if(state.shareToken)p.set('share',state.shareToken);
  p.set('since',state.since);p.set('until',state.until);
  p.set('interest',state.topics.length?state.topics.join(','):'none');
  p.set('prefer',(state.preferredInterests||[]).join(','));
  p.set('font',state.font);p.set('size',String(state.size));p.set('sort',state.sort);
  if(state.category!=='all')p.set('category',state.category);
  if(state.photosOnly)p.set('view','photos');
  if(state.storyId)p.set('story',state.storyId);
  if(state.threadId)p.set('thread',state.threadId);
  if(state.threadId&&state.threadContext)p.set('context','all');
  url.search=p.toString();url.hash='';return url;
}
function albumLinks(story){
  const links=new Map();
  const add=(value,title)=>{try{const url=new URL(value);if(url.protocol==='https:'&&!url.username&&!url.password&&!links.has(url.href))links.set(url.href,{url:url.href,title});}catch{}};
  if(story.albumUrl)add(story.albumUrl,story.albumTitle||'Photo album');
  for(const photo of story.photos||[]){
    if(photo.sourceUrl&&photo.sourceUrl!==photo.url&&['Google Photos','Immich'].includes(photo.provider))add(photo.sourceUrl,photo.provider+' album');
  }
  return [...links.values()];
}

// Web Mercator geometry, shared by the map and its tests. No geocoding or network calls.
function validCoordinates(value){
  return !!value&&Number.isFinite(value.lat)&&Number.isFinite(value.lng)&&Math.abs(value.lat)<=90&&Math.abs(value.lng)<=180;
}
function worldPoint({lat,lng}){
  const sine=Math.sin(Math.max(-85.05112878,Math.min(85.05112878,lat))*Math.PI/180);
  return {x:(lng+180)/360,y:.5-Math.log((1+sine)/(1-sine))/(4*Math.PI)};
}
function worldCoordinates({x,y}){
  return {lat:Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI,lng:((x*360)%360+360)%360-180};
}
function collectMapPlaces(stories){
  const places=new Map();
  for(const story of stories){
    const locations=[];
    if(validCoordinates(story.coordinates))locations.push({coordinates:story.coordinates,label:story.location,image:story.photos?.[0]?.url});
    for(const photo of story.photos||[])if(validCoordinates(photo.coordinates))locations.push({coordinates:photo.coordinates,label:photo.location||story.location,image:photo.url});
    for(const location of locations){
      const {label,image}=location;
      const coordinates={...location.coordinates,lng:location.coordinates.lng===180?-180:location.coordinates.lng};
      const key=coordinates.lat.toFixed(5)+','+coordinates.lng.toFixed(5);
      if(!places.has(key))places.set(key,{id:key,coordinates,label:label||'Location',image,storyIds:[]});
      const place=places.get(key);if(!place.storyIds.includes(story.id))place.storyIds.push(story.id);
    }
  }
  return [...places.values()];
}
function fitMapPlaces(places,width=800,height=500){
  if(!places.length)return {x:.5,y:.45,zoom:1};
  const points=places.map(place=>worldPoint(place.coordinates));
  // Remove the largest empty longitude arc, so Fiji/Samoa fit around the Pacific.
  const xs=points.map(point=>point.x).sort((a,b)=>a-b);
  let gap=-1,start=xs[0];
  for(let i=0;i<xs.length;i++){
    const next=xs[(i+1)%xs.length]+(i===xs.length-1?1:0);
    if(next-xs[i]>gap){gap=next-xs[i];start=next%1;}
  }
  const unwrapped=points.map(point=>point.x<start-1e-9?point.x+1:point.x);
  const minX=Math.min(...unwrapped),maxX=Math.max(...unwrapped);
  const minY=Math.min(...points.map(point=>point.y)),maxY=Math.max(...points.map(point=>point.y));
  const scale=Math.min(Math.max(80,width-112)/Math.max(1e-9,maxX-minX),Math.max(80,height-112)/Math.max(1e-9,maxY-minY));
  const zoom=places.length===1?12:Math.min(14,Math.max(0,Math.floor(Math.log2(scale/256))));
  return {x:((minX+maxX)/2)%1,y:(minY+maxY)/2,zoom};
}
function mapScreenPoint(coordinates,viewport,width,height){
  const point=worldPoint(coordinates),scale=256*2**viewport.zoom;
  let dx=point.x-viewport.x;dx-=Math.round(dx);
  return {x:width/2+dx*scale,y:height/2+(point.y-viewport.y)*scale};
}
function clusterMapPlaces(places,viewport,width,height,radius=52){
  const clusters=[];
  for(const place of places){
    const point=mapScreenPoint(place.coordinates,viewport,width,height);
    if(point.x<-30||point.y<-30||point.x>width+30||point.y>height+30)continue;
    const nearby=clusters.find(cluster=>Math.hypot(cluster.x-point.x,cluster.y-point.y)<radius);
    if(nearby){
      const count=nearby.places.length;nearby.x=(nearby.x*count+point.x)/(count+1);nearby.y=(nearby.y*count+point.y)/(count+1);nearby.places.push(place);
    }else clusters.push({x:point.x,y:point.y,places:[place]});
  }
  return clusters.map(cluster=>({...cluster,storyIds:[...new Set(cluster.places.flatMap(place=>place.storyIds))]}));
}

// Google Maps loads only when a reader opens the map. The story UI stays local.

let googleMapsLoading;
const mapFailureHandlers=new Set();
async function loadGoogleMaps(config={}){
  if(location.protocol==='file:')throw Error('Open the hosted page to use the interactive Google map.');
  if(!config.apiKey)throw Error('Google Maps has not been configured for this page.');
  if(!window.google?.maps?.importLibrary){
    if(!googleMapsLoading)googleMapsLoading=new Promise((resolve,reject)=>{
      const script=document.createElement('script');let timer;
      const fail=message=>{
        clearTimeout(timer);script.remove();delete window.__been2longGoogleMapsReady;
        googleMapsLoading=undefined;reject(Error(message));
      };
      window.__been2longGoogleMapsReady=()=>{clearTimeout(timer);delete window.__been2longGoogleMapsReady;resolve();};
      const previousAuthFailure=window.gm_authFailure;
      window.gm_authFailure=()=>{
        previousAuthFailure?.();
        const message='Google Maps could not authorize this page. You can still browse its stories.';
        fail(message);for(const handler of mapFailureHandlers)handler(Error(message));
      };
      script.src='https://maps.googleapis.com/maps/api/js?'+new URLSearchParams({key:config.apiKey,v:'quarterly',loading:'async',libraries:'marker',callback:'__been2longGoogleMapsReady'});
      script.async=true;script.onerror=()=>fail('Google Maps could not load. Check your connection and try again.');
      timer=setTimeout(()=>fail('Google Maps took too long to load. Try again.'),20000);
      document.head.append(script);
    });
    await googleMapsLoading;
  }
  const [maps,marker]=await Promise.all([window.google.maps.importLibrary('maps'),window.google.maps.importLibrary('marker')]);
  return {Map:maps.Map,AdvancedMarkerElement:marker.AdvancedMarkerElement};
}

// Keep small groups readable without changing the map camera.
function mapPinAction(count,zoom=0,alreadyZoomed=false,placeCount=2){
  if(count===1)return 'open';
  if(count<=4||zoom>=20||(placeCount===1&&alreadyZoomed))return 'expand';
  return 'zoom';
}
function mapFanLayout(count,anchor,width,height,itemHeight=124,itemWidth=112){
  const gap=16,padding=12,bottom=36;
  const columns=count>1&&width>=itemWidth*2+gap+padding*2?2:1,rows=Math.ceil(count/columns);
  const gridWidth=columns*itemWidth+(columns-1)*gap,gridHeight=rows*itemHeight+(rows-1)*gap;
  if(gridWidth>width-padding*2||gridHeight>height-padding-bottom)return null;
  const centerX=Math.max(padding+gridWidth/2,Math.min(width-padding-gridWidth/2,anchor.x));
  const centerY=Math.max(padding+gridHeight/2,Math.min(height-bottom-gridHeight/2,anchor.y));
  return Array.from({length:count},(_,index)=>{
    const row=Math.floor(index/columns),col=index%columns;
    const rowColumns=Math.min(columns,count-row*columns),rowWidth=rowColumns*itemWidth+(rowColumns-1)*gap;
    return {x:centerX-rowWidth/2+itemWidth/2+col*(itemWidth+gap),y:centerY-gridHeight/2+itemHeight/2+row*(itemHeight+gap)};
  });
}

function mapCalloutLayout(count,anchor,width,height,occupied=[],itemHeight=124,itemWidth=112){
  const candidates=[anchor];
  // Prefer the closest free space, keeping callouts inside the visible map.
  for(let y=12+itemHeight/2;y<=height-36-itemHeight/2;y+=24)for(let x=12+itemWidth/2;x<=width-12-itemWidth/2;x+=24)candidates.push({x,y});
  candidates.sort((a,b)=>Math.hypot(a.x-anchor.x,a.y-anchor.y)-Math.hypot(b.x-anchor.x,b.y-anchor.y));
  for(const candidate of candidates){
    const points=mapFanLayout(count,candidate,width,height,itemHeight,itemWidth);
    if(points&&points.every(point=>occupied.every(box=>Math.abs(point.x-box.x)>=(itemWidth+box.width)/2+8||Math.abs(point.y-box.y)>=(itemHeight+box.height)/2+8)))return points;
  }
  return null;
}

function createStoryMap({getStories,imageSrc,esc,dateLabel,onStory,announce,config={}}){
  const $=selector=>document.querySelector(selector);
  let map,api,markers=[],places=[],stories=[],selected=null,signature='',needsFit=true,opening,expanded=null,zoomAttempt=null;
  const stage=$('#map-stage');
  const countLabel=count=>`${count} ${count===1?'story':'stories'}`;
  const dimensions=()=>({width:stage.clientWidth||800,height:stage.clientHeight||480});
  const viewport=()=>{const center=map.getCenter();return {...worldPoint({lat:center.lat(),lng:center.lng()}),zoom:map.getZoom()};};
  function showError(error){
    $('#map-load-status').textContent=error.message;
    $('#map-load-status').hidden=false;$('#map-retry').hidden=location.protocol==='file:';
  }
  mapFailureHandlers.add(error=>{
    for(const marker of markers)marker.map=null;markers=[];
    clearExpansion();
    if(map){map=undefined;stage.innerHTML='';needsFit=true;}
    showError(error);
  });
  function renderList(){
    const shown=selected?stories.filter(story=>selected.storyIds.includes(story.id)):stories.filter(story=>places.some(place=>place.storyIds.includes(story.id)));
    $('#map-place-title').textContent=selected?selected.places.length===1?selected.places[0].label:'Selected stories':'Stories';
    $('#map-show-all').hidden=!selected;
    $('#map-story-list').innerHTML=shown.map(story=>{
      const photo=selected?.places.find(place=>place.storyIds.includes(story.id)&&place.image)?.image||imageSrc(story);
      return `<button class="map-story" data-map-story="${esc(story.id)}">${photo?`<img src="${esc(photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="map-story-placeholder" aria-hidden="true">⌖</span>'}<span><time>${esc(dateLabel(story.date))}</time><strong>${esc(story.title)}</strong><small>${esc(story.location||'Location')}</small></span></button>`;
    }).join('')||'<p class="map-empty">No located stories match these dates and topics. Try a wider selection.</p>';
    $('#map-selection-status').textContent=`${countLabel(shown.length)}${selected?' at this selection':''}`;
  }
  function fit(subset=places,minZoom=0){
    const {width,height}=dimensions(),next=fitMapPlaces(subset,width,height);
    map.moveCamera({center:worldCoordinates(next),zoom:Math.min(20,Math.max(minZoom,next.zoom))});
  }
  const clusterKey=cluster=>cluster.places.map(place=>place.id).sort().join('|');
  function clearExpansion(){
    expanded=null;$('#map-expanded').innerHTML='';
  }
  function expandStories(cluster,position){
    expanded={key:clusterKey(cluster)};paint();
    const button=$('#map-expanded').querySelector('button');
    (button||$('#map-place-title')).focus({preventScroll:true});
    announce?.(`${countLabel(cluster.storyIds.length)}. Select a photo to open a story.`);
  }
  function selectCluster(cluster,position){
    const action=mapPinAction(cluster.storyIds.length,map.getZoom(),zoomAttempt===clusterKey(cluster),cluster.places.length);
    selected=cluster;renderList();clearExpansion();
    if(action==='open'){paint();onStory(cluster.storyIds[0]);return;}
    if(action==='expand'){expandStories(cluster,position);return;}
    zoomAttempt=clusterKey(cluster);fit(cluster.places,map.getZoom()+1);
    announce?.(`${countLabel(cluster.storyIds.length)}. Zoomed in.`);
  }
  function measureCalloutHeight(items){
    const probe=document.createElement('div');
    probe.className='map-story-bubble map-callout-measure';
    $('#map-expanded').append(probe);
    let height=124;
    for(const story of items){
      probe.innerHTML=`<span class="map-bubble-photo"></span><span class="map-bubble-title">${esc(story?.title||'All stories')}</span>`;
      height=Math.max(height,Math.ceil(probe.getBoundingClientRect().height));
    }
    probe.remove();return height;
  }
  function paint(){
    if(!map||!api||!$('#map-dialog').open)return;
    const {width,height}=dimensions(),view=viewport(),scale=256*2**view.zoom;
    const clusters=clusterMapPlaces(places,view,width,height,136);
    const occupied=clusters.map(cluster=>({x:cluster.x,y:cluster.y-22,width:44,height:44,key:clusterKey(cluster)}));
    const lines=[],bubbles=[];
    for(const marker of markers)marker.map=null;markers=[];
    // Place selected groups first, then larger callouts; leave crowded groups as counts.
    clusters.sort((a,b)=>Number(clusterKey(b)===expanded?.key)-Number(clusterKey(a)===expanded?.key)||Math.min(4,b.storyIds.length)-Math.min(4,a.storyIds.length));
    for(const cluster of clusters){
      const key=clusterKey(cluster),multiple=cluster.places.length>1,count=cluster.storyIds.length;
      const position=multiple?worldCoordinates({x:view.x+(cluster.x-width/2)/scale,y:view.y+(cluster.y-height/2)/scale}):cluster.places[0].coordinates;
      const shown=stories.filter(story=>cluster.storyIds.includes(story.id));
      const hasMore=shown.length>4,items=hasMore?[...shown.slice(0,3),null]:shown;
      const showCallouts=count<=4||key===expanded?.key;
      const itemHeight=showCallouts?measureCalloutHeight(items):124;
      const points=showCallouts?mapCalloutLayout(items.length,cluster,width,height,occupied.filter(box=>box.key!==key),itemHeight):null;
      if(points){
        points.forEach((point,index)=>{
          occupied.push({...point,width:112,height:itemHeight});
          const story=items[index];
          const place=story?cluster.places.find(place=>place.storyIds.includes(story.id)):null;
          const origin=place?mapScreenPoint(place.coordinates,view,width,height):cluster;
          const line=`x1="${origin.x}" y1="${origin.y}" x2="${point.x}" y2="${point.y-itemHeight/2+29}"`;
          lines.push(`<line class="map-line-halo" ${line}/><line ${line}/><circle class="map-source-dot" cx="${origin.x}" cy="${origin.y}" r="4"/>`);
          if(!story){bubbles.push(`<button class="map-story-bubble map-more-bubble" style="left:${point.x}px;top:${point.y}px;height:${itemHeight}px" data-map-fan-more aria-label="Show all ${shown.length} stories"><span class="map-bubble-photo">+${shown.length-3}</span><span class="map-bubble-title">All stories</span></button>`);return;}
          const photo=place?.image||imageSrc(story);
          bubbles.push(`<button class="map-story-bubble" style="left:${point.x}px;top:${point.y}px;height:${itemHeight}px" data-map-fan-story="${esc(story.id)}" title="${esc(dateLabel(story.date)+': '+story.title)}" aria-label="${esc(story.title+', '+dateLabel(story.date))}">${photo?`<img class="map-bubble-photo" src="${esc(photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="map-bubble-photo" aria-hidden="true">●</span>'}<span class="map-bubble-title">${esc(story.title)}</span></button>`);
        });
        continue;
      }
      const action=mapPinAction(count,map.getZoom(),zoomAttempt===key,cluster.places.length);
      const label=`${cluster.places.length===1?cluster.places[0].label:cluster.places.length+' places'}, ${countLabel(count)}. ${action==='open'?'Open story.':action==='expand'?'Show story photos.':'Zoom in.'}`;
      const active=selected&&cluster.places.some(place=>selected.places.some(chosen=>chosen.id===place.id));
      const content=document.createElement('div');
      content.className=`map-pin google-map-pin ${multiple?'map-pin-cluster':''} ${active?'map-pin-selected':''}`;
      content.textContent=String(count);
      const marker=new api.AdvancedMarkerElement({map,position,title:label,content});
      marker.addListener('click',()=>selectCluster(cluster,position));markers.push(marker);
    }
    $('#map-expanded').innerHTML=`<svg class="map-fan-lines" viewBox="0 0 ${width} ${height}" aria-hidden="true">${lines.join('')}</svg>${bubbles.join('')}`;
  }
  async function ensureMap(){
    if(map)return;
    api=await loadGoogleMaps(config);
    // The dialog can be dismissed while Google's script is still downloading.
    if(!$('#map-dialog').open)return;
    map=new api.Map(stage,{center:{lat:0,lng:0},zoom:1,mapId:config.mapId||'DEMO_MAP_ID',minZoom:0,maxZoom:20,gestureHandling:'greedy',mapTypeControl:false,streetViewControl:false,fullscreenControl:false,keyboardShortcuts:true,tilt:0,heading:0,tiltInteractionEnabled:false,headingInteractionEnabled:false});
    map.addListener('idle',paint);
    for(const event of ['dragstart','zoom_changed'])map.addListener(event,clearExpansion);
    map.addListener('click',()=>{if(expanded){clearExpansion();paint();}});
  }
  async function initialize(){
    if(opening)return opening;
    $('#map-load-status').textContent='Loading Google Maps…';$('#map-load-status').hidden=false;$('#map-retry').hidden=true;
    opening=(async()=>{
      try{
        await ensureMap();if(!map||!$('#map-dialog').open)return;
        $('#map-load-status').hidden=true;
        if(needsFit){fit();needsFit=false;}paint();
      }catch(error){showError(error);}
      finally{opening=undefined;}
    })();
    return opening;
  }
  async function open(){
    const current=getStories(),next=JSON.stringify(current.map(story=>[story.id,story.coordinates,story.photos,story.title,story.date,story.location]));
    const changed=signature!==next;signature=next;stories=current;places=collectMapPlaces(stories);
    if(changed){selected=null;needsFit=true;zoomAttempt=null;clearExpansion();}
    $('#map-dialog').showModal();
    const located=new Set(places.flatMap(place=>place.storyIds));
    $('#map-summary').textContent=`${countLabel(located.size)} · ${places.length} ${places.length===1?'place':'places'}${current.length>located.size?` · ${current.length-located.size} without a location`:''}`;
    renderList();
    if(places.length)await initialize();
    else{
      for(const marker of markers)marker.map=null;markers=[];
      $('#map-load-status').textContent='No located stories in this selection.';$('#map-load-status').hidden=false;$('#map-retry').hidden=true;
    }
  }
  $('#map-story-list').addEventListener('click',event=>{const button=event.target.closest('[data-map-story]');if(button)onStory(button.dataset.mapStory);});
  $('#map-fit').addEventListener('click',()=>{selected=null;zoomAttempt=null;clearExpansion();renderList();if(map){fit();paint();}});
  $('#map-show-all').addEventListener('click',()=>{selected=null;zoomAttempt=null;clearExpansion();renderList();paint();});
  $('#map-expanded').addEventListener('click',event=>{
    const story=event.target.closest('[data-map-fan-story]');
    if(story){event.stopPropagation();onStory(story.dataset.mapFanStory);return;}
    if(event.target.closest('[data-map-fan-more]')){event.stopPropagation();$('#map-place-title').focus({preventScroll:true});$('#map-place-title').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
  });
  $('#map-retry').addEventListener('click',initialize);
  window.addEventListener('resize',()=>{if($('#map-dialog').open){clearExpansion();paint();}});
  document.fonts?.addEventListener('loadingdone',()=>{if($('#map-dialog').open)paint();});
  return {open};
}

function httpsUrl(value) {
  try { const u = new URL(value); return u.protocol === 'https:' && !u.username && !u.password ? u.href : null; } catch { return null; }
}
function validatePhoto(photo) {
  if(!photo || typeof photo!=='object' || typeof photo.url!=='string' || !httpsUrl(photo.url))return false;

function openDropdown(id){for(const key of ['since-menu','personalize-menu','share-menu'])$('#'+key).open=key===id;}
function showPersonalize(){openDropdown('personalize-menu');}
function renderAlbumLinks(story,compact=false){const links=albumLinks(story);return links.length?`<div class="album-links ${compact?'compact-albums':''}" aria-label="Photo albums">${links.map(link=>`<a href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">▧ ${esc(link.title)} ↗</a>`).join('')}</div>`:'';}
async function copyLink(id){const url=shareUrl(id);try{await navigator.clipboard.writeText(url.href);$('#share-menu').open=false;toast('Link copied with dates, topics, font, and text size.');}catch{showSettings(`<h2>Copy catch-up link</h2><label class="field">Link<input id="share-link" readonly value="${esc(url.href)}"></label>`);$('#share-link').select();}}
async function systemShare(){const url=shareUrl();if(!navigator.share){await copyLink();return;}try{await navigator.share({title:authorProfile.name+' — catch-up',url:url.href});$('#share-menu').open=false;}catch(e){if(e.name!=='AbortError')await copyLink();}}
function showSiteAbout(){showSettings(`<h2>About this site</h2><p>Been2long was vibe coded by <a class="about-author-link" href="https://linkedin.com/in/adamsah" target="_blank" rel="noopener noreferrer">Adam Sah</a>. It’s a way to catch up on the life events and stories since you last spoke.</p><details class="media-credits"><summary>Demo & media credits</summary><p>The Alex and Jamie stories are fictional. Stock photos illustrate the stories, and linked videos belong to their credited creators.</p><div class="credits-list">${mediaCredits.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.name)}<small>${esc(c.author)}</small></a>`).join('')}</div></details>`);}
function renderPhotoGallery(story){
  const photos=storyPhotos(story);
  if(!photos.length)return '';
  return `<section class="detail-gallery" aria-label="Story photos">${photos.map((p,i)=>`<figure>${i?`<img src="${esc(p.url)}" alt="${esc(p.alt||p.title||story.alt||story.title)}" loading="lazy" referrerpolicy="no-referrer">`:''}<figcaption>${esc(p.alt||p.title)} ${p.date?`· ${esc(dateLabel(p.date))}`:''} ${p.sourceUrl&&!albumLinks(story).some(link=>link.url===p.sourceUrl)?`<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">Original photo ↗</a>`:''}</figcaption></figure>`).join('')}</section>`;
}
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let storyObserver=null;
let motionFrame=0;
let animatedPhotos=new Set();
function refreshStoryMotion(){
  storyObserver?.disconnect();
  animatedPhotos.clear();
  if(motionPreference.matches || !('IntersectionObserver' in window)){
    $$('.story-card').forEach(card=>{card.classList.add('is-revealed');card.style.removeProperty('--photo-zoom');});
    return;
  }
  storyObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){
      const card=entry.target;
      if(entry.isIntersecting){
        // Entry motion happens once; images continue to respond to scroll.
        if(!card.classList.contains('is-revealed')){
          card.classList.add('is-revealed');
          const text=$('.card-body',card);
          if(!card.classList.contains('card-quiet'))text?.animate([{transform:'translateY(14px)'},{transform:'translateY(0)'}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
        }
        if(!card.classList.contains('card-quiet'))animatedPhotos.add(card);
      }else animatedPhotos.delete(card);
    }
    queuePhotoMotion();
  },{rootMargin:'60px 0px',threshold:0});
  $$('.story-card').forEach(card=>storyObserver.observe(card));
  queuePhotoMotion();
}
function queuePhotoMotion(){
  if(motionPreference.matches || motionFrame)return;
  motionFrame=requestAnimationFrame(()=>{
    motionFrame=0;
    const height=innerHeight;
    for(const card of animatedPhotos){
      const photo=$('.card-photo',card);if(!photo)continue;
      const rect=photo.getBoundingClientRect();
      const progress=Math.max(0,Math.min(1,(height-rect.top)/(height+rect.height)));
      card.style.setProperty('--photo-zoom',(1+progress*.065).toFixed(4));
    }
  });
}
function updateNavigation(){
  const section=$('#chapters').getBoundingClientRect().top < innerHeight*.4?'stories':'overview';
  $$('.navigation>a[href^="#"],.mobile-section-nav>a').forEach(link=>{
    const active=link.hash==='#'+section;
    link.classList.toggle('active',active);
    if(active)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
  });
}
window.addEventListener('scroll',()=>{queuePhotoMotion();updateNavigation();},{passive:true});
window.addEventListener('resize',queuePhotoMotion);
motionPreference.addEventListener('change',()=>{cancelAnimationFrame(motionFrame);motionFrame=0;if(motionPreference.matches)document.getAnimations().forEach(animation=>animation.cancel());refreshStoryMotion();});

// Reader interactions for the portable HTML. No network requests or publishing.
$('.filters').innerHTML='<button data-category="all" class="selected">All stories <span id="all-count"></span></button>'+Object.entries(categories).map(([id,label])=>`<button data-category="${esc(id)}">${esc(label)}</button>`).join('');
document.addEventListener('click',event=>{
  const target=event.target.closest('button,a');if(!target)return;
  if(target.dataset.open){
    event.preventDefault();
    if($('#settings-dialog').open)$('#settings-dialog').close();
    openStory(target.dataset.open,target.dataset.timelineThread?'thread':target.closest('#overview')?'overview':target.closest('#story-detail')?storyNavigationScope:'timeline',target.dataset.timelineThread||storyNavigationThreadId);
    return;
  }
  if(target.dataset.thread){selectThread(target.dataset.thread);return;}
  if(target.dataset.threadCluster){
    showThreadCluster(target.dataset.threadCluster,target.dataset.clusterIds);return;
  }
  if(target.dataset.shareStory){copyLink(target.dataset.shareStory);return;}
  if(target.hasAttribute('data-close-story')){$('#story-dialog').close();return;}
  if(target.hasAttribute('data-category')){category=target.dataset.category;selectedThreadId=null;threadContext=false;render();return;}
  if(target.hasAttribute('data-reset')){
    category='all';selectedThreadId=null;threadContext=false;photosOnly=false;
    selectedInterests.clear();Object.keys(interestNames).forEach(topic=>selectedInterests.add(topic));
    reader.since=defaultReader.since;until=TODAY;render();return;
  }
  switch(target.id){
    case 'open-map':showMap();break;
    case 'open-timeline':$('#timeline-dialog').showModal();break;
    case 'clear-thread':selectedThreadId=null;threadContext=false;render();break;
    case 'show-thread-history':threadContext=!threadContext;render();break;
    case 'photos-only':photosOnly=!photosOnly;render();break;
    case 'copy-catchup-link':copyLink();break;
    case 'system-share':systemShare();break;
    case 'credits-button':showSiteAbout();break;
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='since-inline-form')return;
  event.preventDefault();const fields=new FormData(event.target);
  const since=parseDate(fields.get('since')),through=parseDate(fields.get('until'));
  const error=$('#date-error');error.textContent='';
  if(!since||!through||since>through||through>TODAY){error.textContent='Choose a start date before the end date, through today.';return;}
  reader.since=since;until=through;$('#since-menu').open=false;render();
});
$('#sort').addEventListener('change',event=>{sort=event.target.value;render();});
$('#year-jump').addEventListener('change',event=>{
  const target=$$('.story-card,.gallery-tile').find(card=>card.dataset.year===event.target.value);
  target?.scrollIntoView({behavior:motionPreference.matches?'instant':'smooth',block:'start'});
});
$$('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{
  if(event.target.closest('.dialog-close')){dialog.close();return;}
  if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}
}));
$('#story-dialog').addEventListener('close',()=>{
  openStoryId=null;storyNavigationScope='timeline';storyNavigationThreadId=null;
  $('#story-detail').innerHTML='';updateUrl();
});
document.addEventListener('change',event=>{
  if(event.target.closest('#font-options')){reading.font=event.target.value;applyReading();storage.set('been2long-reading-v1',reading);updateUrl();}
  if(event.target.closest('#size-options')){reading.size=Number(event.target.value);applyReading();storage.set('been2long-reading-v1',reading);updateUrl();}
});
$('#topic-options').innerHTML=Object.entries(interestNames).map(([id,name])=>`<label><input type="checkbox" value="${esc(id)}" ${selectedInterests.has(id)?'checked':''}>${esc(name)}</label>`).join('');
$('#personalize-options').addEventListener('change',event=>{
  if(event.target.id==='all-topics'){selectedInterests.clear();if(event.target.checked)Object.keys(interestNames).forEach(topic=>selectedInterests.add(topic));}
  else if(event.target.checked)selectedInterests.add(event.target.value);else selectedInterests.delete(event.target.value);
  render();
});
const menus=['since-menu','personalize-menu','share-menu'];
for(const id of menus)$('#'+id).addEventListener('toggle',()=>{if($('#'+id).open)for(const other of menus)if(other!==id)$('#'+other).open=false;});
document.addEventListener('click',event=>{for(const id of menus)if(!event.target.closest('#'+id))$('#'+id).open=false;});
document.addEventListener('keydown',event=>{if(event.key==='Escape')for(const id of menus)if($('#'+id).open){$('#'+id).open=false;$('#'+id+' summary').focus();}});
render();
if(params.get('story'))openStory(params.get('story'),selectedThreadId?'thread':'timeline',selectedThreadId);

})();
</script>
</body>
